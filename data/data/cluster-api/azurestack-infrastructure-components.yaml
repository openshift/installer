                            This should be disabled when SecurityEncryptionType is set to DiskWithVMGuestState.
                            Default is disabled.
                          type: boolean
                        securityType:
                          description: |-
                            SecurityType specifies the SecurityType of the virtual machine. It has to be set to any specified value to
                            enable UefiSettings. The default behavior is: UefiSettings will not be enabled unless this property is set.
                          enum:
                            - ConfidentialVM
                            - TrustedLaunch
                          type: string
                        uefiSettings:
                          description: UefiSettings specifies the security settings like secure boot and vTPM used while creating the virtual machine.
                          properties:
                            secureBootEnabled:
                              description: |-
                                SecureBootEnabled specifies whether secure boot should be enabled on the virtual machine.
                                Secure Boot verifies the digital signature of all boot components and halts the boot process if signature verification fails.
                                If omitted, the platform chooses a default, which is subject to change over time, currently that default is false.
                              type: boolean
                            vTpmEnabled:
                              description: |-
                                VTpmEnabled specifies whether vTPM should be enabled on the virtual machine.
                                When true it enables the virtualized trusted platform module measurements to create a known good boot integrity policy baseline.
                                The integrity policy baseline is used for comparison with measurements from subsequent VM boots to determine if anything has changed.
                                This is required to be set to Enabled if SecurityEncryptionType is defined.
                                If omitted, the platform chooses a default, which is subject to change over time, currently that default is false.
                              type: boolean
                          type: object
                      type: object
                    spotVMOptions:
                      description: SpotVMOptions allows the ability to specify the Machine should use a Spot VM
                      properties:
                        evictionPolicy:
                          description: EvictionPolicy defines the behavior of the virtual machine when it is evicted. It can be either Delete or Deallocate.
                          enum:
                            - Deallocate
                            - Delete
                          type: string
                        maxPrice:
                          anyOf:
                            - type: integer
                            - type: string
                          description: MaxPrice defines the maximum price the user is willing to pay for Spot VM instances
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                      type: object
                    sshPublicKey:
                      description: |-
                        SSHPublicKey is the SSH public key string, base64-encoded to add to a Virtual Machine. Linux only.
                        Refer to documentation on how to set up SSH access on Windows instances.
                      type: string
                    subnetName:
                      description: 'Deprecated: SubnetName should be set in the networkInterfaces field.'
                      type: string
                    terminateNotificationTimeout:
                      description: |-
                        TerminateNotificationTimeout enables or disables VMSS scheduled events termination notification with specified timeout
                        allowed values are between 5 and 15 (mins)
                      type: integer
                    vmExtensions:
                      description: VMExtensions specifies a list of extensions to be added to the scale set.
                      items:
                        description: VMExtension specifies the parameters for a custom VM extension.
                        properties:
                          name:
                            description: Name is the name of the extension.
                            type: string
                          protectedSettings:
                            additionalProperties:
                              type: string
                            description: ProtectedSettings is a JSON formatted protected settings for the extension.
                            type: object
                          publisher:
                            description: Publisher is the name of the extension handler publisher.
                            type: string
                          settings:
                            additionalProperties:
                              type: string
                            description: Settings is a JSON formatted public settings for the extension.
                            type: object
                          version:
                            description: Version specifies the version of the script handler.
                            type: string
                        required:
                          - name
                          - publisher
                          - version
                        type: object
                      type: array
                    vmSize:
                      description: |-
                        VMSize is the size of the Virtual Machine to build.
                        See https://learn.microsoft.com/rest/api/compute/virtualmachines/createorupdate#virtualmachinesizetypes
                      type: string
                  required:
                    - osDisk
                    - vmSize
                  type: object
                userAssignedIdentities:
                  description: |-
                    UserAssignedIdentities is a list of standalone Azure identities provided by the user
                    The lifecycle of a user-assigned identity is managed separately from the lifecycle of
                    the AzureMachinePool.
                    See https://learn.microsoft.com/azure/active-directory/managed-identities-azure-resources/how-to-manage-ua-identity-cli
                  items:
                    description: |-
                      UserAssignedIdentity defines the user-assigned identities provided
                      by the user to be assigned to Azure resources.
                    properties:
                      providerID:
                        description: |-
                          ProviderID is the identification ID of the user-assigned Identity, the format of an identity is:
                          'azure:///subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}'
                        type: string
                    required:
                      - providerID
                    type: object
                  type: array
                zoneBalance:
                  description: ZoneBalane dictates whether to force strictly even Virtual Machine distribution cross x-zones in case there is zone outage.
                  type: boolean
              required:
                - location
                - template
              type: object
            status:
              description: AzureMachinePoolStatus defines the observed state of AzureMachinePool.
              properties:
                conditions:
                  description: Conditions defines current service state of the AzureMachinePool.
                  items:
                    description: Condition defines an observation of a Cluster API resource operational state.
                    properties:
                      lastTransitionTime:
                        description: |-
                          Last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed. If that is not known, then using the time when
                          the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          A human readable message indicating details about the transition.
                          This field may be empty.
                        type: string
                      reason:
                        description: |-
                          The reason for the condition's last transition in CamelCase.
                          The specific API may choose whether or not this field is considered a guaranteed API.
                          This field may be empty.
                        type: string
                      severity:
                        description: |-
                          severity provides an explicit classification of Reason code, so the users or machines can immediately
                          understand the current situation and act accordingly.
                          The Severity field MUST be set only when Status=False.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: |-
                          type of condition in CamelCase or in foo.example.com/CamelCase.
                          Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                          can be useful (see .node.status.conditions), the ability to deconflict is important.
                        type: string
                    required:
                      - lastTransitionTime
                      - status
                      - type
                    type: object
                  type: array
                failureMessage:
                  description: |-
                    FailureMessage will be set in the event that there is a terminal problem
                    reconciling the MachinePool and will contain a more verbose string suitable
                    for logging and human consumption.

                    This field should not be set for transitive errors that a controller
                    faces that are expected to be fixed automatically over
                    time (like service outages), but instead indicate that something is
                    fundamentally wrong with the MachinePool's spec or the configuration of
                    the controller, and that manual intervention is required. Examples
                    of terminal errors would be invalid combinations of settings in the
                    spec, values that are unsupported by the controller, or the
                    responsible controller itself being critically misconfigured.

                    Any transient errors that occur during the reconciliation of MachinePools
                    can be added as events to the MachinePool object and/or logged in the
                    controller's output.
                  type: string
                failureReason:
                  description: |-
                    FailureReason will be set in the event that there is a terminal problem
                    reconciling the MachinePool and will contain a succinct value suitable
                    for machine interpretation.

                    This field should not be set for transitive errors that a controller
                    faces that are expected to be fixed automatically over
                    time (like service outages), but instead indicate that something is
                    fundamentally wrong with the MachinePool's spec or the configuration of
                    the controller, and that manual intervention is required. Examples
                    of terminal errors would be invalid combinations of settings in the
                    spec, values that are unsupported by the controller, or the
                    responsible controller itself being critically misconfigured.

                    Any transient errors that occur during the reconciliation of MachinePools
                    can be added as events to the MachinePool object and/or logged in the
                    controller's output.
                  type: string
                image:
                  description: |-
                    Image is the current image used in the AzureMachinePool. When the spec image is nil, this image is populated
                    with the details of the defaulted Azure Marketplace "capi" offer.
                  properties:
                    computeGallery:
                      description: ComputeGallery specifies an image to use from the Azure Compute Gallery
                      properties:
                        gallery:
                          description: Gallery specifies the name of the compute image gallery that contains the image
                          minLength: 1
                          type: string
                        name:
                          description: Name is the name of the image
                          minLength: 1
                          type: string
                        plan:
                          description: Plan contains plan information.
                          properties:
                            offer:
                              description: |-
                                Offer specifies the name of a group of related images created by the publisher.
                                For example, UbuntuServer, WindowsServer
                              minLength: 1
                              type: string
                            publisher:
                              description: Publisher is the name of the organization that created the image
                              minLength: 1
                              type: string
                            sku:
                              description: |-
                                SKU specifies an instance of an offer, such as a major release of a distribution.
                                For example, 18.04-LTS, 2019-Datacenter
                              minLength: 1
                              type: string
                          required:
                            - offer
                            - publisher
                            - sku
                          type: object
                        resourceGroup:
                          description: ResourceGroup specifies the resource group containing the private compute gallery.
                          type: string
                        subscriptionID:
                          description: SubscriptionID is the identifier of the subscription that contains the private compute gallery.
                          type: string
                        version:
                          description: |-
                            Version specifies the version of the marketplace image. The allowed formats
                            are Major.Minor.Build or 'latest'. Major, Minor, and Build are decimal numbers.
                            Specify 'latest' to use the latest version of an image available at deploy time.
                            Even if you use 'latest', the VM image will not automatically update after deploy
                            time even if a new version becomes available.
                          minLength: 1
                          type: string
                      required:
                        - gallery
                        - name
                        - version
                      type: object
                    id:
                      description: ID specifies an image to use by ID
                      type: string
                    marketplace:
                      description: Marketplace specifies an image to use from the Azure Marketplace
                      properties:
                        offer:
                          description: |-
                            Offer specifies the name of a group of related images created by the publisher.
                            For example, UbuntuServer, WindowsServer
                          minLength: 1
                          type: string
                        publisher:
                          description: Publisher is the name of the organization that created the image
                          minLength: 1
                          type: string
                        sku:
                          description: |-
                            SKU specifies an instance of an offer, such as a major release of a distribution.
                            For example, 18.04-LTS, 2019-Datacenter
                          minLength: 1
                          type: string
                        thirdPartyImage:
                          default: false
                          description: |-
                            ThirdPartyImage indicates the image is published by a third party publisher and a Plan
                            will be generated for it.
                          type: boolean
                        version:
                          description: |-
                            Version specifies the version of an image sku. The allowed formats
                            are Major.Minor.Build or 'latest'. Major, Minor, and Build are decimal numbers.
                            Specify 'latest' to use the latest version of an image available at deploy time.
                            Even if you use 'latest', the VM image will not automatically update after deploy
                            time even if a new version becomes available.
                          minLength: 1
                          type: string
                      required:
                        - offer
                        - publisher
                        - sku
                        - version
                      type: object
                    sharedGallery:
                      description: |-
                        SharedGallery specifies an image to use from an Azure Shared Image Gallery
                        Deprecated: use ComputeGallery instead.
                      properties:
                        gallery:
                          description: Gallery specifies the name of the shared image gallery that contains the image
                          minLength: 1
                          type: string
                        name:
                          description: Name is the name of the image
                          minLength: 1
                          type: string
                        offer:
                          description: |-
                            Offer specifies the name of a group of related images created by the publisher.
                            For example, UbuntuServer, WindowsServer
                            This value will be used to add a `Plan` in the API request when creating the VM/VMSS resource.
                            This is needed when the source image from which this SIG image was built requires the `Plan` to be used.
                          type: string
                        publisher:
                          description: |-
                            Publisher is the name of the organization that created the image.
                            This value will be used to add a `Plan` in the API request when creating the VM/VMSS resource.
                            This is needed when the source image from which this SIG image was built requires the `Plan` to be used.
                          type: string
                        resourceGroup:
                          description: ResourceGroup specifies the resource group containing the shared image gallery
                          minLength: 1
                          type: string
                        sku:
                          description: |-
                            SKU specifies an instance of an offer, such as a major release of a distribution.
                            For example, 18.04-LTS, 2019-Datacenter
                            This value will be used to add a `Plan` in the API request when creating the VM/VMSS resource.
                            This is needed when the source image from which this SIG image was built requires the `Plan` to be used.
                          type: string
                        subscriptionID:
                          description: SubscriptionID is the identifier of the subscription that contains the shared image gallery
                          minLength: 1
                          type: string
                        version:
                          description: |-
                            Version specifies the version of the marketplace image. The allowed formats
                            are Major.Minor.Build or 'latest'. Major, Minor, and Build are decimal numbers.
                            Specify 'latest' to use the latest version of an image available at deploy time.
                            Even if you use 'latest', the VM image will not automatically update after deploy
                            time even if a new version becomes available.
                          minLength: 1
                          type: string
                      required:
                        - gallery
                        - name
                        - resourceGroup
                        - subscriptionID
                        - version
                      type: object
                  type: object
                infrastructureMachineKind:
                  description: InfrastructureMachineKind is the kind of the infrastructure resources behind MachinePool Machines.
                  type: string
                instances:
                  description: Instances is the VM instance status for each VM in the VMSS
                  items:
                    description: AzureMachinePoolInstanceStatus provides status information for each instance in the VMSS.
                    properties:
                      instanceID:
                        description: InstanceID is the identification of the Machine Instance within the VMSS
                        type: string
                      instanceName:
                        description: InstanceName is the name of the Machine Instance within the VMSS
                        type: string
                      latestModelApplied:
                        description: |-
                          LatestModelApplied indicates the instance is running the most up-to-date VMSS model. A VMSS model describes
                          the image version the VM is running. If the instance is not running the latest model, it means the instance
                          may not be running the version of Kubernetes the Machine Pool has specified and needs to be updated.
                        type: boolean
                      providerID:
                        description: ProviderID is the provider identification of the VMSS Instance
                        type: string
                      provisioningState:
                        description: ProvisioningState is the provisioning state of the Azure virtual machine instance.
                        type: string
                      version:
                        description: Version defines the Kubernetes version for the VM Instance
                        type: string
                    required:
                      - latestModelApplied
                    type: object
                  type: array
                longRunningOperationStates:
                  description: |-
                    LongRunningOperationStates saves the state for Azure long-running operations so they can be continued on the
                    next reconciliation loop.
                  items:
                    description: Future contains the data needed for an Azure long-running operation to continue across reconcile loops.
                    properties:
                      data:
                        description: Data is the base64 url encoded json Azure AutoRest Future.
                        type: string
                      name:
                        description: |-
                          Name is the name of the Azure resource.
                          Together with the service name, this forms the unique identifier for the future.
                        type: string
                      resourceGroup:
                        description: ResourceGroup is the Azure resource group for the resource.
                        type: string
                      serviceName:
                        description: |-
                          ServiceName is the name of the Azure service.
                          Together with the name of the resource, this forms the unique identifier for the future.
                        type: string
                      type:
                        description: Type describes the type of future, such as update, create, delete, etc.
                        type: string
                    required:
                      - data
                      - name
                      - serviceName
                      - type
                    type: object
                  type: array
                provisioningState:
                  description: ProvisioningState is the provisioning state of the Azure virtual machine.
                  type: string
                ready:
                  description: Ready is true when the provider resource is ready.
                  type: boolean
                replicas:
                  description: Replicas is the most recently observed number of replicas.
                  format: int32
                  type: integer
                version:
                  description: Version is the Kubernetes version for the current VMSS model
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
