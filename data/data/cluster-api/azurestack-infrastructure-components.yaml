                      - serviceName
                      - type
                    type: object
                  type: array
                ready:
                  description: Ready is true when the provider resource is ready.
                  type: boolean
                vmState:
                  description: VMState is the provisioning state of the Azure virtual machine.
                  type: string
              type: object
